<style>

.lab{font:12px/1.5 'Press Start 2P',monospace;margin:0 0 22px}
.ghost{position:absolute;left:0;right:0;top:34%;text-align:center;font:clamp(40px,13vw,150px) 'Press Start 2P',monospace;color:rgba(43,42,40,.11);pointer-events:none;z-index:0}
.panel{position:relative;z-index:1;max-width:660px;min-height:260px;margin:0 auto;background:#FFF3BD;border:4px solid #2B2A28;border-radius:14px;padding:22px;box-shadow:6px 6px 0 #2B2A28;animation:pop .4s steps(5) both}

.chip{display:inline-block;border:3px solid #2B2A28;border-radius:8px;padding:2px 8px;margin:0 6px 8px 0;font-size:22px}
.ctl{display:flex;align-items:center;gap:14px;margin-top:26px;position:relative;z-index:1}
.arrow{width:44px;height:44px;flex:none;border-radius:50%;border:4px solid #2B2A28;background:#FFF3BD;font:16px 'Press Start 2P',monospace;cursor:pointer;color:#2B2A28}
.xp{flex:1;display:grid;grid-template-columns:repeat(20,1fr);gap:3px;padding:5px;border:4px solid #2B2A28;border-radius:8px;background:rgba(255,255,255,.45)}
.xp i{height:16px;background:rgba(43,42,40,.15);transition:background .05s}
.xp i.on{background:var(--blue)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.tab{font:10px 'Press Start 2P',monospace;background:none;border:0;border-bottom:4px solid transparent;padding:6px 4px;cursor:pointer;color:#2B2A28;opacity:.6}
.tab[aria-pressed=true]{opacity:1;border-color:#E0392B}
.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding-top:18px}
.ch{background:var(--org);border:3px solid #2B2A28;border-radius:12px;padding:14px 4px 10px;display:grid;justify-items:center;gap:12px;cursor:pointer;font:9px 'Press Start 2P',monospace;color:#2B2A28;transition:transform .12s steps(3),box-shadow .12s steps(3)}
.ch[aria-pressed=true]{transform:translateY(-14px);background:var(--red);color:#fff;box-shadow:0 10px 0 #2B2A28}
.cd{margin-top:30px;max-width:640px;animation:pop .4s steps(5) both}
.cd h3{font:14px 'Press Start 2P',monospace;margin:0 0 12px}
.cd p{margin:0;font-size:27px}
.big{font:clamp(18px,4.2vw,40px)/1.4 'Press Start 2P',monospace;margin:0 0 18px;text-shadow:4px 4px 0 var(--org)}
@media (max-width:640px){.cast{grid-template-columns:repeat(3,1fr)}.hud .mid{display:none}.ctl{gap:8px}.arrow{width:38px;height:38px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
